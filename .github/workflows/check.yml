name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Build account-free tests and distribution (POSIX)
        if: runner.os != 'Windows'
        run: sh gradlew check buildPlugin verifyPluginStructure --no-daemon
      - name: Build account-free tests and distribution (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\gradlew.bat check buildPlugin verifyPluginStructure --no-daemon
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-${{ matrix.os }}
          path: build/distributions/*.zip
          if-no-files-found: error
          retention-days: 7
# No Codex credentials, signing credentials, Marketplace tokens, release publication,
# pull_request_target, arbitrary remote scripts, or account-backed model calls.
